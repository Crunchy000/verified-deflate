name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      modules:
        description: "Only verify these Kani modules (comma-separated prefixes, e.g. zip,crc32); empty = all"
        required: false
        default: ""
      harness_timeout:
        description: "Per-harness time limit in seconds"
        required: false
        default: "1800"
      publish_logs:
        description: "Push raw Kani logs to ci-logs/* branches as each harness finishes"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  KANI_VERSION: "0.68.0"

jobs:
  test:
    name: Tests, lints, interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install zip/unzip for interop tests
        run: sudo apt-get install -y zip unzip
      - name: Format
        run: .github/scripts/run-and-report.sh fmt cargo fmt --all --check
      - name: Clippy
        run: .github/scripts/run-and-report.sh clippy cargo clippy --all-targets -- -D warnings
      - name: Clippy (proof harnesses)
        run: .github/scripts/run-and-report.sh clippy-harnesses cargo clippy --lib --profile test -- -D warnings
        env:
          RUSTFLAGS: --cfg kani --cfg kani_sample
      - name: Tests (including zlib, unzip and Info-ZIP interop)
        run: .github/scripts/run-and-report.sh tests cargo test --release
      - name: Kani harnesses as randomised tests (sanity check, not proof)
        run: .github/scripts/run-and-report.sh sampled-harnesses cargo test --lib --release -- proofs e2e
        env:
          RUSTFLAGS: --cfg kani --cfg kani_sample
          KANI_SAMPLE_ITERS: "50000"
      - name: Docs
        run: .github/scripts/run-and-report.sh docs cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: MSRV (1.83)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.83
      - run: .github/scripts/run-and-report.sh msrv cargo build --lib --bins

  kani:
    name: Kani ${{ matrix.module }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: "bitio::proofs::", file: src/bitio.rs }
          - { module: "crc32::proofs::", file: src/crc32.rs }
          - { module: "tables::proofs::", file: src/tables.rs }
          - { module: "huffman::proofs::", file: src/huffman.rs }
          - { module: "lz77::proofs::", file: src/lz77.rs, flags: "-Z stubbing --no-memory-safety-checks" }
          - { module: "deflate::proofs::", file: src/deflate.rs, flags: "-Z stubbing --no-memory-safety-checks" }
          - { module: "inflate::proofs::", file: src/inflate.rs, flags: "-Z stubbing --no-memory-safety-checks" }
          - { module: "zip::proofs::", file: src/zip.rs }
          - { module: "e2e::", file: src/e2e.rs, flags: "-Z stubbing --no-memory-safety-checks" }
    steps:
      - name: Select
        id: sel
        env:
          ONLY: ${{ github.event.inputs.modules }}
          MODULE: ${{ matrix.module }}
        run: |
          run=true
          if [ -n "$ONLY" ]; then
            run=false
            for tok in ${ONLY//,/ }; do
              case "$MODULE" in "$tok"*) run=true ;; esac
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.sel.outputs.run == 'true'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.sel.outputs.run == 'true'
      - name: Cache Kani
        if: steps.sel.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/kani
            ~/.cargo/bin/cargo-kani
            ~/.kani
            ~/.rustup/toolchains/nightly-*
          key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}
      - name: Install Kani ${{ env.KANI_VERSION }}
        if: steps.sel.outputs.run == 'true'
        run: |
          if ! command -v cargo-kani >/dev/null || ! cargo kani --version | grep -q "$KANI_VERSION"; then
            cargo install --locked kani-verifier --version "$KANI_VERSION"
          fi
          cargo kani setup
      - name: Verify (one process per harness)
        if: steps.sel.outputs.run == 'true'
        env:
          KANI_HARNESS_TIMEOUT: ${{ github.event.inputs.harness_timeout || '1800' }}
          KANI_EXTRA_FLAGS: ${{ matrix.flags }}
          GITHUB_TOKEN: ${{ github.token }}
          MODULE: ${{ matrix.module }}
        run: |
          if [ "${{ github.event.inputs.publish_logs }}" = "true" ]; then
            export PUBLISH_BRANCH="ci-logs/$(printf '%s' "$MODULE" | tr -c 'a-z0-9' '-')"
          fi
          .github/scripts/kani_module.sh "${{ matrix.module }}" "${{ matrix.file }}"
      - name: Report
        if: always() && steps.sel.outputs.run == 'true'
        run: python3 .github/scripts/kani_report.py kani-logs
