# Coverage-guided fuzzing with cargo-fuzz (libFuzzer); see README.md here.
# A crate of its own, so the library keeps no dependencies.
[package]
name = "verified-deflate-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
# The references: C zlib, through flate2, and for Deflate64 zlib's
# infback9 (in infback9/, built by build.rs against this zlib's header).
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libz-sys = { version = "1", features = ["static"] }
# C libbz2 1.0.8, built from the source bzip2-sys bundles.
bzip2-sys = { version = "0.1", features = ["static"] }
# C liblzma: the system's (XZ Utils 5.8 on the CI image), found through
# pkg-config, so the reference is current rather than lzma-sys's bundled 5.2.
lzma-sys = "0.1"

verified-deflate = { path = ".." }

[build-dependencies]
cc = "1"

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "inflate"
path = "fuzz_targets/inflate.rs"
test = false
doc = false
bench = false

